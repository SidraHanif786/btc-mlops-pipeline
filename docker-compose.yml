services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  flask-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "5000:5000"
    environment:
      MODEL_STAGE: local-compose
      LOG_LEVEL: INFO
      PORT: 5000
      MODEL_DIR: /app/models
      RELOAD_TOKEN: dev-reload-token
    volumes:
      - shared_models:/app/models
      - shared_data:/app/data
      - ./.dill:/app/dill:ro

  airflow:
    image: apache/airflow:2.9.3-python3.10
    depends_on:
      postgres:
        condition: service_healthy
      flask-api:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: supersecretkey
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      FLASK_RELOAD_URL: http://flask-api:5000/reload
      RELOAD_TOKEN: dev-reload-token
      DATA_DIR: /opt/airflow/shared_data
      MODEL_DIR: /opt/airflow/shared_models
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./.venv/lib/python3.10/site-packages:/opt/airflow/venv_packages:ro
      - shared_models:/opt/airflow/shared_models
      - shared_data:/opt/airflow/shared_data
    command: standalone

volumes:
  shared_models:
  shared_data: