apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-internal
spec:
  type: ClusterIP
  selector:
    app: btc-forecast-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-external
spec:
  type: NodePort
  selector:
    app: btc-forecast-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080