# PIPELINE DEFINITION
# Name: btc-7day-forecast-pipeline
# Description: Automated BTC-USD ingestion, feature engineering, and model training.
# Outputs:
#    train-btc-model-metrics_artifact: system.Metrics
components:
  comp-generate-features:
    executorLabel: exec-generate-features
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        features_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-ingest-btc-data:
    executorLabel: exec-ingest-btc-data
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-btc-model:
    executorLabel: exec-train-btc-model
    inputDefinitions:
      artifacts:
        features_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics_artifact:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-generate-features:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_features
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.8.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_features(\n    raw_data: dsl.Input[dsl.Dataset],\n \
          \   features_data: dsl.Output[dsl.Dataset],\n):\n    import pandas as pd\n\
          \n    df = pd.read_csv(raw_data.path)\n    df[\"Date\"] = pd.to_datetime(df[\"\
          Date\"])\n    df = df.sort_values(\"Date\").reset_index(drop=True)\n   \
          \ df[\"close_lag_1\"] = df[\"Close\"].shift(1)\n    df[\"close_lag_2\"]\
          \ = df[\"Close\"].shift(2)\n    df[\"close_lag_3\"] = df[\"Close\"].shift(3)\n\
          \    df[\"close_lag_7\"] = df[\"Close\"].shift(7)\n    df[\"ma_7\"] = df[\"\
          Close\"].rolling(7).mean()\n    df[\"ma_30\"] = df[\"Close\"].rolling(30).mean()\n\
          \    df[\"return_1d\"] = df[\"Close\"].pct_change()\n    df[\"volatility_7\"\
          ] = df[\"return_1d\"].rolling(7).std()\n    df[\"target_next_close\"] =\
          \ df[\"Close\"].shift(-1)\n    df.dropna().to_csv(features_data.path, index=False)\n\
          \n"
        image: python:3.10-slim
    exec-ingest-btc-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_btc_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.8.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'yfinance'\
          \ 'requests' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_btc_data(raw_data: dsl.Output[dsl.Dataset]):\n    import\
          \ yfinance as yf\n    import pandas as pd\n\n    df = yf.download(\"BTC-USD\"\
          , period=\"2y\", interval=\"1d\", progress=False)\n    if isinstance(df.columns,\
          \ pd.MultiIndex):\n        df.columns = df.columns.get_level_values(0)\n\
          \    df = df.reset_index()[[\"Date\", \"Open\", \"High\", \"Low\", \"Close\"\
          , \"Volume\"]]\n    df.dropna().to_csv(raw_data.path, index=False)\n\n"
        image: python:3.10-slim
    exec-train-btc-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_btc_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.8.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ 'scikit-learn' 'joblib' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_btc_model(\n    features_data: dsl.Input[dsl.Dataset],\n\
          \    model_artifact: dsl.Output[dsl.Model],\n    metrics_artifact: dsl.Output[dsl.Metrics],\n\
          ):\n    import joblib\n    import numpy as np\n    import pandas as pd\n\
          \    from sklearn.linear_model import Ridge\n    from sklearn.metrics import\
          \ mean_absolute_error, mean_squared_error\n\n    cols = [\n        \"close_lag_1\"\
          ,\n        \"close_lag_2\",\n        \"close_lag_3\",\n        \"close_lag_7\"\
          ,\n        \"ma_7\",\n        \"ma_30\",\n        \"volatility_7\",\n  \
          \      \"return_1d\",\n    ]\n    df = pd.read_csv(features_data.path)\n\
          \    train_df, test_df = df.iloc[:-7], df.iloc[-7:]\n\n    model = Ridge(alpha=1.0)\n\
          \    model.fit(train_df[cols], train_df[\"target_next_close\"])\n    preds\
          \ = model.predict(test_df[cols])\n    y_true = test_df[\"target_next_close\"\
          ].values\n\n    mae = float(mean_absolute_error(y_true, preds))\n    rmse\
          \ = float(np.sqrt(mean_squared_error(y_true, preds)))\n    mape = float(\n\
          \        np.mean(np.abs((y_true - preds) / np.clip(y_true, 1e-8, None)))\
          \ * 100\n    )\n\n    metrics_artifact.log_metric(\"MAE\", mae)\n    metrics_artifact.log_metric(\"\
          RMSE\", rmse)\n    metrics_artifact.log_metric(\"MAPE\", mape)\n    joblib.dump(model,\
          \ model_artifact.path)\n\n"
        image: python:3.10-slim
pipelineInfo:
  description: Automated BTC-USD ingestion, feature engineering, and model training.
  name: btc-7day-forecast-pipeline
root:
  dag:
    outputs:
      artifacts:
        train-btc-model-metrics_artifact:
          artifactSelectors:
          - outputArtifactKey: metrics_artifact
            producerSubtask: train-btc-model
    tasks:
      generate-features:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-features
        dependentTasks:
        - ingest-btc-data
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: ingest-btc-data
        taskInfo:
          name: generate-features
      ingest-btc-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-btc-data
        taskInfo:
          name: ingest-btc-data
      train-btc-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-btc-model
        dependentTasks:
        - generate-features
        inputs:
          artifacts:
            features_data:
              taskOutputArtifact:
                outputArtifactKey: features_data
                producerTask: generate-features
        taskInfo:
          name: train-btc-model
  outputDefinitions:
    artifacts:
      train-btc-model-metrics_artifact:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.8.0
